server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.smarthospital.cloud;

    ssl_certificate     /etc/ssl/certs/smarthospital.crt;
    ssl_certificate_key /etc/ssl/private/smarthospital.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Security headers ----------
    add_header X-Frame-Options           "DENY"                              always;
    add_header X-Content-Type-Options    "nosniff"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag              "noindex, nofollow, noarchive, nosnippet" always;

    # CSP produzione — note:
    #   'unsafe-inline' su style-src: richiesto da Angular Material (inline styles generati)
    #   'unsafe-eval': NON presente in prod
    #   connect-src 'self': copre l'API se same-origin via reverse proxy;
    #     aggiungere https://api.smarthospital.cloud se su sottodominio separato
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self' https://www.google.com https://www.gstatic.com; "
        "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
        "font-src 'self' data: https://fonts.gstatic.com; "
        "img-src 'self' data: blob: https://www.gstatic.com https://*.smarthospital.cloud; "
        "connect-src 'self' https://*.smarthospital.cloud https://www.google.com; "
        "frame-src https://www.google.com; "
        "worker-src 'self'; "
        "frame-ancestors 'none'"
        always;

    # ---------- SPA routing ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Asset caching (JS/CSS con hash nel nome → immutable) ----------
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options        "DENY"                            always;
        add_header X-Content-Type-Options "nosniff"                         always;
    }

    # ---------- Reverse proxy API ----------
    # Decommentare se FE e backend sono nello stesso host (Docker Compose / stesso server).
    # location /api/ {
    #     proxy_pass         http://central-backend:8081/api/;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}
