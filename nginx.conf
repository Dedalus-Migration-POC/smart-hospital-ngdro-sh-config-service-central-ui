server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Macro per gli header di sicurezza (ripetuta nei location che definiscono add_header propri,
    # altrimenti nginx non eredita gli header del blocco server)
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http: https:; frame-src https://www.google.com https://recaptcha.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
    add_header X-Frame-Options           "DENY"                              always;
    add_header X-Content-Type-Options    "nosniff"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
    add_header X-Robots-Tag              "noindex, nofollow, noarchive, nosnippet" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control          "public, immutable"                 always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http: https:; frame-src https://www.google.com https://recaptcha.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
        add_header X-Frame-Options        "DENY"                              always;
        add_header X-Content-Type-Options "nosniff"                           always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

