<section class="home">
  <mat-card appearance="outlined" class="home__card">
    <mat-card-header>
      <mat-card-title>{{ 'home.welcome' | translate }}</mat-card-title>
      @if (currentUser(); as user) {
        <mat-card-subtitle>
          {{ 'home.connectedAs' | translate }} <strong>{{ user.username }}</strong>
          @if (user.role) {
            {{ 'home.withRole' | translate }} <strong>{{ user.role }}</strong>
          }
        </mat-card-subtitle>
      }
    </mat-card-header>
    <mat-card-content>
      <p class="home__hint">{{ 'home.hint' | translate }}</p>
    </mat-card-content>
  </mat-card>
</section>
