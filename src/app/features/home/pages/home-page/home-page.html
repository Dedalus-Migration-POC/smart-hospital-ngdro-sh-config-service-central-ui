<div class="home-shell">
  <mat-card appearance="outlined" class="home-card">
    <mat-card-header>
      <mat-card-title>Configuratore centrale</mat-card-title>
      <mat-card-subtitle>Sei autenticato</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (currentUser(); as user) {
        <p>
          Utente: <strong>{{ user.username }}</strong>
          @if (user.role) {
            — ruolo <strong>{{ user.role }}</strong>
          }
        </p>
      }
      <p class="home-hint">
        Da qui in poi verranno aggiunte le sezioni: customer, installation, tenant,
        configurazioni, utenti, audit log.
      </p>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-stroked-button (click)="logout()">Logout</button>
    </mat-card-actions>
  </mat-card>
</div>
