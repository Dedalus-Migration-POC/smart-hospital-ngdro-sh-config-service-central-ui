<section class="home">
  <mat-card appearance="outlined" class="home__card">
    <mat-card-header>
      <mat-card-title>Benvenuto</mat-card-title>
      @if (currentUser(); as user) {
        <mat-card-subtitle>
          Sei collegato come <strong>{{ user.username }}</strong>
          @if (user.role) {
            con ruolo <strong>{{ user.role }}</strong>
          }
        </mat-card-subtitle>
      }
    </mat-card-header>
    <mat-card-content>
      <p class="home__hint">
        Usa il menu a sinistra per navigare tra le sezioni del configuratore.
        Le voci marcate <em>prossimamente</em> verranno aggiunte nei prossimi step.
      </p>
    </mat-card-content>
  </mat-card>
</section>
