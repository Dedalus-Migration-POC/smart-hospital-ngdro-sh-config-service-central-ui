# Ingress per sh-config-service-central-ui — AWS ALB
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sh-config-service-central-ui
  namespace: sh-configurator
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:500820381187:certificate/9014ee65-c1e9-47ec-ae41-8e61f8670f99
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: deletion_protection.enabled=false
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: configurator.smarthospital.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sh-config-service-central-ui
                port:
                  number: 80
